modLoader="javafml"
loaderVersion="[${forgeMajor},)"

license="MIT"

[[mods]]
modId="virtual_redstone_wire"
version="${version}"
displayName="Virtual Redstone Wire"
logoFile="virtual_redstone_wire.png"
credits="JularDepick"
authors="JularDepick"
description='''
A Minecraft mod for long-distance redstone signal transmission that does not rely on physical redstone blocks, supporting one-to-one, one-to-many, and many-to-one connections.
'''

[[dependencies.virtual_redstone_wire]]
    modId="forge"
    mandatory=true
    versionRange="[${forgeMajor},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.virtual_redstone_wire]]
    modId="minecraft"
    mandatory=true
    versionRange="[${mcCompatMin},${mcNextVersion})"
    ordering="NONE"
    side="BOTH"
