plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '0.5.2'
group = 'com.virtualredstonewire'
archivesBaseName = 'VirtualRedstoneWire'

// MC 版本单源化：mappings、forge 依赖、产物文件名共用
def mcVersion = '1.20.1'

// 版本号单源化：build.gradle 的 version 为唯一来源，
// processResources 将 mods.toml 中的 ${version} 占位替换为实际版本
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    maven {
        url 'https://maven.aliyun.com/repository/public'
    }
    maven {
        url 'https://maven.aliyun.com/repository/central'
    }
    maven {
        url 'https://repo.huaweicloud.com/repository/maven'
    }
    maven {
        url 'https://maven.minecraftforge.net/'
    }
    maven {
        url 'https://libraries.minecraft.net/'
    }
    mavenCentral()
}

minecraft {
    mappings channel: 'official', version: mcVersion

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'virtual_redstone_wire'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            arg '-mixin.config=mixins.virtual_redstone_wire.json'
            mods {
                virtualredstonewire {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'virtual_redstone_wire'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            arg '-mixin.config=mixins.virtual_redstone_wire.json'
            mods {
                virtualredstonewire {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${mcVersion}-47.4.22"
    annotationProcessor 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

jar {
    // 产物命名：VirtualRedstoneWire-v<version>-forge-mc<mcVersion>.jar（v 前缀仅用于文件名，mods.toml 内部版本保持纯 semver）
    archiveFileName = "${archivesBaseName}-v${project.version}-forge-mc${mcVersion}.jar"
    manifest {
        attributes([
            "Specification-Title"     : "Virtual Redstone Wire",
            "Specification-Vendor"    : "JularDepick",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Vendor"   : "JularDepick",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            // Forge 1.20.1 产环境唯一认可的 mixin 配置加载方式（dev 环境靠 runs 的 arg 参数，
            // 产环境必须靠 MANIFEST 属性，否则 mixin 静默不加载导致信号注入失效）
            "MixinConfigs"            : "mixins.virtual_redstone_wire.json"
        ])
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
